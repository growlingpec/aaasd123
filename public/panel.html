<div class="login" id="login" hidden>
  <form class="lcard" id="loginF" autocomplete="on">
    <div class="brand"><span class="mark"><img src="/icon-p-amber.svg" alt=""></span>Premier</div>
    <div id="step1">
      <h1>Вход в панель</h1>
      <p class="lead">Управление Premier</p>
      <label class="field"><span>Логин</span><input id="lg" autocomplete="username" placeholder="owner" spellcheck="false" autocapitalize="off"><small>Владелец может оставить поле пустым</small></label>
      <label class="field"><span>Пароль</span><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus></label>
      <label class="check"><input type="checkbox" id="remember">Запомнить на этом устройстве на 7 дней</label>
    </div>
    <div id="step2" hidden>
      <h1>Подтвердите вход</h1>
      <p class="lead">Введите 6 цифр из приложения-аутентификатора</p>
      <label class="field"><input id="code" class="code-inp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Код подтверждения"></label>
    </div>
    <div class="msg err" id="lmsg" role="alert"></div>
    <button class="btn pri block" id="lbtn">Войти</button>
    <div class="lfoot"><button type="button" class="btn ghost sm" id="back" hidden>← Другой аккаунт</button></div>
  </form>
</div>
