# Вариант с nginx вместо Caddy: /etc/nginx/sites-available/premier
# Сертификат: sudo certbot --nginx -d example.ru
# WebSocket (терминал облачного компьютера): Upgrade проходит, обычные запросы — как раньше
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
server {
    listen 80;
    server_name example.ru www.example.ru;
    return 301 https://example.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.ru;
    # строки ssl_certificate добавит certbot

    client_max_body_size 45m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # ответы модели идут потоком
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

